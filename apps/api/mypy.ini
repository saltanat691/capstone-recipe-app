[mypy]
plugins = pydantic.mypy
python_version = 3.10
ignore_missing_imports = False

# pgvector ships no py.typed marker as of 0.3.6
[mypy-pgvector.sqlalchemy]
ignore_missing_imports = True

# pydantic-settings reads required fields (e.g. DATABASE_URL) from env at
# runtime; without a plugin hint, mypy thinks the call site is missing them.
[mypy-app.core.config]
disable_error_code = call-arg