version: '3.9'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recipe-postgres
    environment:
      POSTGRES_DB: recipe_ai
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_user -d recipe_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:11.0.0
    container_name: recipe-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3001
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3001:3001"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - tempo
      - loki
    networks:
      - recipe-network

  # Tempo for distributed tracing
  tempo:
    image: grafana/tempo:2.4.1
    container_name: recipe-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"   # Tempo HTTP API/UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ../tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo-data:/tmp/tempo
    networks:
      - recipe-network

  # Loki for log aggregation
  loki:
    image: grafana/loki:3.0.0
    container_name: recipe-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"   # Loki HTTP API
    volumes:
      - ../loki/loki.yml:/etc/loki/loki.yml
      - loki-data:/loki
    networks:
      - recipe-network

volumes:
  postgres-data:
    driver: local
  grafana-data:
    driver: local
  tempo-data:
    driver: local
  loki-data:
    driver: local

networks:
  recipe-network:
    driver: bridge